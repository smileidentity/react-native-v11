name: Update Android Version

on:
  workflow_dispatch:
    inputs:
      android_release_version:
        description: 'SmileID Android Version'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.android_release_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate version
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid version: $VERSION"; exit 1; }'
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SMILE_PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SMILE_PR_BOT_PRIVATE_KEY }}
          owner: smileidentity
          repositories: react-native-v11
          permission-contents: read
          permission-pull-requests: write
      - name: Create Release Branch
        run: |
          git checkout -b "android-$VERSION"
      - name: Read build.gradle
        id: read-file
        run: |
          sed -i "s/\(SmileId_androidVersion=\).*/\1\"$(echo "$VERSION" | cut -c 2-)\"/" android/gradle.properties
      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add android/gradle.properties
          git commit -m "Update Android SDK version to $VERSION"
          git push --set-upstream origin "android-$VERSION"
      - name: Create Pull Request
        run: |
          gh pr create --title "Merge release android-$VERSION into main" --body "This is an automated pull request to update the version." --base main --head "android-$VERSION"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
