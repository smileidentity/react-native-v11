name: Security Audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'android/*.gradle*'
      - 'android/**/*.gradle*'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  yarn-audit:
    name: Yarn Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=yarn.lock
            --format=table

  gradle-audit:
    name: Gradle Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            --format=table
            ./android

  create-issue:
    name: Create Issue on Failure
    needs: [yarn-audit, gradle-audit]
    if: always() && github.event_name != 'pull_request' && (needs.yarn-audit.result == 'failure' || needs.gradle-audit.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create issue for audit failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "security-audit" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then exit 0; fi

          FAILED_AUDITS=""
          if [ "${{ needs.yarn-audit.result }}" = "failure" ]; then
            FAILED_AUDITS="yarn"
          fi
          if [ "${{ needs.gradle-audit.result }}" = "failure" ]; then
            FAILED_AUDITS="${FAILED_AUDITS:+$FAILED_AUDITS, }gradle"
          fi

          TITLE_DATE=$(date +%Y-%m-%d)
          gh issue create \
            --title "Security: dependency vulnerabilities detected (${TITLE_DATE})" \
            --label "security-audit,priority:high" \
            --body "The daily security audit has detected vulnerabilities in: ${FAILED_AUDITS}. See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
