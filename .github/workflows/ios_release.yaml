name: Update iOS Version

on:
  workflow_dispatch:
    inputs:
      ios_release_version:
        description: 'SmileID iOS Version'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-ios:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.ios_release_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate version
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid version: $VERSION"; exit 1; }'
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SMILE_PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SMILE_PR_BOT_PRIVATE_KEY }}
          owner: smileidentity
          repositories: react-native-v11
          permission-contents: read
          permission-pull-requests: write
      - name: Create Release Branch
        run: |
          git checkout -b "ios-$VERSION"
          git push origin "ios-$VERSION"
      - name: Read build.gradle
        id: read-file
        run: |
          sed -i "s/s.dependency\s*'SmileID'\s*,\s*'[^']*'/s.dependency 'SmileID', '$(echo "$VERSION" | cut -c 2-)'/g" react-native-smile-id.podspec
      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add react-native-smile-id.podspec
          git commit -m "Update iOS SDK version to $VERSION"
          git push --set-upstream origin "ios-$VERSION"
      - name: Create Pull Request
        run: |
          gh pr create --title "Merge release ios-$VERSION into main" --body "This is an automated pull request to update the version." --base main --head "ios-$VERSION"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
